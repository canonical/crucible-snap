name: Snap CI

on:
  pull_request:
  push:
    branches:
      - 'main'
  workflow_dispatch:
  # Crucible is built from upstream HEAD, so upstream changes can break the
  # build or the tests without any commit here.
  schedule:
    - cron: '0 2 * * *'

jobs:
  build:
    name: Build snap (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", large]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-cts-snap-${{ matrix.arch }}
          path: ${{ steps.build.outputs.snap }}

      # The runners have no GPU; run the snap on Mesa's software Vulkan
      # driver (lavapipe) from mesa-2404 so a broken Vulkan setup inside the
      # snap (e.g. the test app missing the gpu-2404 wrapper) fails here.
      - name: Install snap
        run: |
          set -euo pipefail
          sudo snap install mesa-2404
          sudo snap install --dangerous "${{ steps.build.outputs.snap }}"
          sudo snap connect crucible:gpu-2404 mesa-2404:gpu-2404

      - name: Smoke test on lavapipe
        env:
          VK_ICD_FILENAMES: /snap/crucible/current/gpu-2404/usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          set -euo pipefail
          unset DISPLAY WAYLAND_DISPLAY
          crucible.vulkaninfo --summary > vulkaninfo.txt
          cat vulkaninfo.txt
          if ! grep -Eq 'driverName += llvmpipe' vulkaninfo.txt; then
            echo "::error::crucible.vulkaninfo did not find the lavapipe device"
            exit 1
          fi
          # Groups that pass on lavapipe. bug.*, example.*, func.memory-fd.*,
          # func.memory_budget and func.sync.* have expected failures there.
          for pattern in \
            'func.depthstencil.*' \
            'func.miptree.r8g8b8a8-unorm.aspect-color.*' \
            'func.buffer.*' \
            'func.compute.*' \
            'func.mesh.*' \
            'func.shader.*' \
            'stress.*'; do
            echo "::group::crucible.test $pattern"
            rc=0
            crucible.test "$pattern" > crucible.txt 2>&1 || rc=$?
            cat crucible.txt
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::crucible.test '$pattern' exited with $rc"
              exit 1
            fi
            if ! grep -Eq '^crucible: info +: pass [1-9]' crucible.txt; then
              echo "::error::crucible.test '$pattern' passed no tests"
              exit 1
            fi
          done

      - name: Remove snap
        if: always()
        run: sudo snap remove --purge crucible || true

  publish:
    name: Publish to edge (${{ matrix.arch }})
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: [self-hosted, linux, "${{ matrix.arch }}", large]
    needs: build
    # Scheduled runs only check that upstream HEAD still builds and passes.
    if: github.event_name != 'pull_request' && github.event_name != 'schedule' && github.ref_name == github.event.repository.default_branch
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vulkan-cts-snap-${{ matrix.arch }}
          path: .

      - name: Resolve snap file
        id: snap
        run: |
          set -euo pipefail
          snap_path="$(find . -maxdepth 2 -type f -name '*.snap' | head -n 1)"
          if [ -z "$snap_path" ]; then
            echo "No .snap artifact found"
            exit 1
          fi
          echo "path=$snap_path" >> "$GITHUB_OUTPUT"

      - name: Publish to Snap Store edge
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.path }}
          release: edge
